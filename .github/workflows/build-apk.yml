name: Build APK

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["README.md", "legacy/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install web + Capacitor deps
        run: npm ci

      - name: Copy game into the Android project
        run: npx cap sync android

      - name: Build APK (runner ships the Android SDK in $ANDROID_HOME)
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk deadlink-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: deadlink-apk
          path: deadlink-*.apk

      - name: Publish as a GitHub release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DEADLINK build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: deadlink-*.apk
          body: |
            Sideload build from `${{ github.ref_name }}` @ ${{ github.sha }}.
            On your phone: tap **deadlink-${{ github.run_number }}.apk** below, open it, and allow "install unknown apps" for your browser if asked.
            Newer builds install over older ones and keep your save.
