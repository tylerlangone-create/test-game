<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0b0c">
<meta name="mobile-web-app-capable" content="yes">
<title>DEADLINK</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0c;--bg2:#121214;--panel:#151517;--line:#2c2a24;--line2:#4a4335;--amber:#e8a33d;--amber2:#ffb84d;--dim:#8f8778;--txt:#e9e2d2;--white:#f4efe2;--red:#ff4d3d;--green:#9fd94a;--ice:#7fd8e8;--r0:#7a7a72;--r1:#c9c2b2;--r2:#e8a33d;--r3:#ff6a4d;--r4:#b6ff2e;--fh:'Chakra Petch',monospace;--fb:'IBM Plex Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--txt);font-family:var(--fb);font-size:13px;position:fixed;inset:0}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:90;background:repeating-linear-gradient(0deg,rgba(232,163,61,.025) 0 1px,transparent 1px 3px)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:89;box-shadow:inset 0 0 18vmin rgba(0,0,0,.75)}
#app{position:absolute;inset:0;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 10px)}
.screen.on{display:flex}
.frame{position:relative;border:1px solid var(--line2);background:var(--panel)}
.frame::before,.frame::after,.frame>.ck::before,.frame>.ck::after{content:"";position:absolute;width:9px;height:9px;border-color:var(--amber);border-style:solid;z-index:2}
.frame::before{top:-1px;left:-1px;border-width:2px 0 0 2px}.frame::after{top:-1px;right:-1px;border-width:2px 2px 0 0}
.frame>.ck::before{bottom:-1px;left:-1px;border-width:0 0 2px 2px}.frame>.ck::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
h1,h2,h3,.hd{font-family:var(--fh);text-transform:uppercase;letter-spacing:.08em}
.btn{display:block;width:100%;padding:12px 14px;margin:7px 0;background:#191713;border:1px solid var(--line2);color:var(--txt);font-family:var(--fh);font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase;text-align:left;cursor:pointer;transition:background .12s,border-color .12s}
.btn:active{background:#241f16;border-color:var(--amber)}
.btn::before{content:"▸ ";color:var(--amber)}
.btn.primary{border-color:var(--amber);color:var(--amber2)}
.btn.danger{border-color:#6e2a24;color:var(--red)}
.btn.small{padding:8px 10px;font-size:11px;margin:4px 0}
.btn[disabled]{opacity:.38;pointer-events:none}
.dimtx{color:var(--dim)}.redtx{color:var(--red)}.ambtx{color:var(--amber2)}.grntx{color:var(--green)}
.row{display:flex;gap:8px;align-items:center}.spread{justify-content:space-between}
.glogo{font:700 clamp(44px,14vw,64px)/1 var(--fh);color:var(--white);letter-spacing:.04em;position:relative;animation:flick 4s infinite steps(1)}
.glogo::before,.glogo::after{content:attr(data-t);position:absolute;inset:0}
.glogo::before{color:var(--amber);clip-path:inset(0 0 62% 0);animation:g1 2.3s infinite steps(1)}
.glogo::after{color:var(--red);clip-path:inset(58% 0 0 0);animation:g2 1.9s infinite steps(1)}
@keyframes g1{0%,88%{transform:translate(-2px,0)}90%{transform:translate(-6px,-2px);clip-path:inset(10% 0 50% 0)}94%{transform:translate(3px,1px);clip-path:inset(0 0 70% 0)}98%{transform:translate(-2px,0)}}
@keyframes g2{0%,80%{transform:translate(2px,0)}84%{transform:translate(6px,2px);clip-path:inset(70% 0 0 0)}90%{transform:translate(-3px,0);clip-path:inset(45% 0 20% 0)}95%{transform:translate(2px,0)}}
@keyframes flick{0%,92%{opacity:1}93%{opacity:.7}94%{opacity:1}97%{opacity:.85}98%{opacity:1}}
.subt{color:var(--dim);letter-spacing:.22em;font-size:10px;text-transform:uppercase;margin-bottom:24px}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border:1px solid var(--line2);background:#141412;margin-bottom:8px;font-size:11px;letter-spacing:.08em}
.topbar .hd{color:var(--amber2)}
.iconbtn{background:none;border:1px solid var(--line2);color:var(--dim);min-width:34px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0 8px;font-family:var(--fh);font-size:10px;letter-spacing:.1em}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.clslist{flex:1;overflow-y:auto;padding:4px 0 20px}
.clscard{padding:13px;margin:10px 0;cursor:pointer}
.clscard h3{font-size:20px;color:var(--amber2)}
.clstag{font-size:10px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.clsdesc{margin:8px 0;color:#c9c2b2;font-size:12px;line-height:1.5}
.gim{border-left:2px solid var(--amber);padding:6px 8px;background:#1a1712;font-size:11px;margin:8px 0;line-height:1.45}
.clscard.lock{opacity:.7}.clscard.lock h3{color:var(--dim)}
.depthbar{display:flex;gap:2px;margin:8px 0 10px}
.depthbar i{flex:1;height:6px;background:#232019}
.depthbar i.b{background:#3a2f1c;height:9px}
.depthbar i.done{background:var(--amber)}
.depthbar i.cur{background:var(--white);outline:1px solid var(--amber)}
.nodetitle{text-align:center;margin:2px 0 4px}
.nodetitle .hd{font-size:26px;color:var(--white)}
.whisper{text-align:center;color:#6e675c;font-size:10px;font-style:italic;margin-bottom:10px;letter-spacing:.04em}
.nodelist{flex:1;overflow-y:auto;padding-bottom:8px}
.node{padding:12px 14px;margin:9px 0;cursor:pointer;display:flex;gap:12px;align-items:center}
.node:active{border-color:var(--amber);background:#1c1913}
.node .nic{color:var(--amber);flex:none}.node .nic svg{width:26px;height:26px}
.node .nn{font-family:var(--fh);font-weight:600;font-size:14px;letter-spacing:.08em}
.node .nd{font-size:10.5px;color:var(--dim);margin-top:2px;line-height:1.35}
.node .risk{margin-left:auto;font-size:9px;letter-spacing:.15em;padding:2px 6px;border:1px solid var(--line2);color:var(--dim);flex:none}
.risk.hot{color:var(--red);border-color:#5e2a24}.risk.mid{color:var(--amber2)}
.node.bossnode .nn{color:var(--red)}
.footrow{display:flex;gap:8px;padding-top:6px}
.footrow .btn{margin:0;text-align:center}.footrow .btn::before{content:""}
#scrBattle{padding-top:calc(env(safe-area-inset-top) + 6px);gap:6px}
#arena{flex:1;display:flex;flex-direction:column;gap:6px;min-height:0;position:relative}
.upanel{padding:8px 10px;transition:transform .12s}
.upanel.lunge{transform:translateY(-7px)}.upanel.lungeP{transform:translateY(7px)}
.upanel.hurt{animation:hurtfx .3s}
@keyframes hurtfx{0%{background:#3a1512}100%{background:var(--panel)}}
.uname{font-family:var(--fh);font-weight:700;font-size:14px;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.uname .tt{font-size:9px;padding:1px 5px;border:1px solid #5e2a24;color:var(--red);letter-spacing:.15em}
.barlab{display:flex;justify-content:space-between;font-size:9.5px;color:var(--dim);letter-spacing:.12em;margin:5px 0 2px}
.bar{height:10px;background:#1d1b17;border:1px solid var(--line);position:relative;overflow:hidden}
.bar .fill{position:absolute;inset:0;transform-origin:left;transition:transform .25s;background:var(--amber)}
.bar.sp{height:7px}.bar.sp .fill{background:#b7b2a0}
.bar .ticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(0,0,0,.5) 9px 10px)}
.bar.low .fill{background:var(--red);animation:lowpulse .7s infinite alternate}
@keyframes lowpulse{to{opacity:.55}}
.stsrow{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px;min-height:14px}
.stchip{font-size:8.5px;letter-spacing:.08em;padding:1px 4px;border:1px solid var(--line2);color:var(--dim);background:#191713}
.stchip.bad{color:var(--red);border-color:#5e2a24}.stchip.good{color:var(--green);border-color:#3c4d24}.stchip.neu{color:var(--ice);border-color:#2c4a4d}
.elmini{display:flex;gap:4px;margin-left:auto}.elmini svg{width:13px;height:13px;stroke-width:2.4}
.elmini .wk{color:var(--amber2);animation:blink 1s infinite steps(2)}.elmini .rs{opacity:.3}
@keyframes blink{50%{opacity:.25}}
.sigwrap{width:84px;height:84px;flex:none}
.sigwrap canvas{width:100%;height:100%;animation:sigidle 5s ease-in-out infinite}
@keyframes sigidle{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.05) rotate(2deg)}}
.foeflex{display:flex;gap:10px;align-items:center}
.dmgfloat{position:absolute;left:50%;top:36%;transform:translateX(-50%);font:700 20px var(--fh);color:var(--white);pointer-events:none;z-index:5;animation:floatup .95s forwards;text-shadow:0 0 6px #000;white-space:nowrap}
.dmgfloat.crit{color:var(--amber2);font-size:26px}.dmgfloat.heal{color:var(--green)}.dmgfloat.miss{color:var(--dim);font-size:14px}.dmgfloat.shield{color:var(--ice);font-size:15px}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,8px)}12%{opacity:1}100%{opacity:0;transform:translate(-50%,-46px)}}
.shake{animation:shakefx .32s}
@keyframes shakefx{0%,100%{transform:translate(0)}20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,-1px)}}
#blog{flex:1;min-height:56px;overflow-y:auto;padding:6px 9px;font-size:11px;line-height:1.55;background:#0e0e10;border:1px solid var(--line)}
#blog div{animation:fadein .25s}
@keyframes fadein{from{opacity:0;transform:translateY(3px)}}
#blog .p{color:#d8cfb8}#blog .f{color:#e88a7d}#blog .s{color:#6e675c}#blog .c{color:var(--amber2);font-weight:600}#blog .g{color:var(--green)}#blog .b{color:var(--ice)}
#turnlab{text-align:center;font:600 10px var(--fh);letter-spacing:.3em;color:var(--dim);padding:2px 0}
#turnlab.mine{color:var(--amber2);animation:blink 1.1s infinite steps(2)}
#skillgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sk{position:relative;padding:9px 9px 8px;background:#161511;border:1px solid var(--line2);color:var(--txt);cursor:pointer;text-align:left;min-height:52px;overflow:hidden}
.sk:active{background:#221d13}
.sk .skname{font:600 11.5px var(--fh);letter-spacing:.05em;display:block;padding-right:22px}
.sk .skmeta{font-size:9px;color:var(--dim);margin-top:3px;display:block;letter-spacing:.05em}
.sk .skel{position:absolute;left:0;top:0;bottom:0;width:3px}
.sk .cdov{position:absolute;right:6px;top:5px;font:700 16px var(--fh);color:var(--red)}
.sk.cool{opacity:.55}.sk.nosp{opacity:.45}
.sk .occhip{position:absolute;right:5px;bottom:5px;font-size:8.5px;padding:2px 5px;border:1px solid #5e2a24;color:var(--red);letter-spacing:.08em;background:#180d0b}
.sk .occhip.arm{background:var(--red);color:#fff}
.sk.focus .skname{color:var(--dim)}
.sk .spcost{color:var(--ice)}
#modal{position:absolute;inset:0;background:rgba(5,5,6,.86);z-index:60;display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#mbox{width:100%;max-width:520px;max-height:88%;overflow-y:auto;background:var(--bg2);border:1px solid var(--line2);border-bottom:none;padding:14px;animation:mup .22s}
@keyframes mup{from{transform:translateY(30px);opacity:0}}
#mbox h3{color:var(--amber2);font-size:16px;margin-bottom:8px}
#mbox .mtxt{font-size:12px;line-height:1.6;color:#c9c2b2;margin-bottom:10px;white-space:pre-wrap}
.mchoice{display:block;width:100%;text-align:left;padding:11px 12px;margin:6px 0;background:#191713;border:1px solid var(--line2);color:var(--txt);cursor:pointer;font-family:var(--fb)}
.mchoice:active{border-color:var(--amber)}
.mchoice .mct{font:600 12.5px var(--fh);letter-spacing:.07em;text-transform:uppercase}
.mchoice .mcs{font-size:10px;color:var(--dim);margin-top:2px}
.itmtag{font-size:9px;letter-spacing:.18em;padding:1px 6px;border:1px solid currentColor}
.itmline{font-size:11px;line-height:1.55}
.ovl{position:absolute;inset:0;background:rgba(5,5,6,.94);z-index:55;display:none;flex-direction:column;justify-content:center;padding:18px;overflow-y:auto}
.ovl.on{display:flex}
.bigword{font:700 30px var(--fh);letter-spacing:.06em;text-align:center;margin-bottom:6px}
.rline{display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px dashed var(--line);font-size:12.5px}
.dropcard{padding:10px;margin:8px 0}
.listscroll{flex:1;overflow-y:auto;padding-bottom:10px}
.statgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin:8px 0}
.statgrid .cell{border:1px solid var(--line);padding:6px 8px;background:#131210}
.statgrid .k{font-size:9px;color:var(--dim);letter-spacing:.12em}
.statgrid .v{font:600 15px var(--fh);color:var(--white)}
.eqslot{padding:10px;margin:6px 0;cursor:pointer}
.eqslot .slt{font-size:9px;letter-spacing:.2em;color:var(--dim)}
.skrow{padding:9px 10px;margin:5px 0;background:#151411;border:1px solid var(--line);cursor:pointer}
.skrow.eqd{border-color:var(--amber)}
.skrow .skd{font-size:9.5px;color:var(--dim);margin-top:2px;line-height:1.35}
#toast{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 74px);left:50%;transform:translateX(-50%);background:#1d1811;border:1px solid var(--amber);color:var(--amber2);padding:8px 14px;font-size:11px;z-index:80;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:90%}
#toast.on{opacity:1}
::-webkit-scrollbar{width:0;height:0}
/* ------- INTRO ------- */
#scrIntro{padding:0;background:#050506}
#introCv{position:absolute;inset:0;width:100%;height:100%}
#introTxt{position:absolute;left:0;right:0;top:44%;text-align:center;padding:0 26px;font:500 13px var(--fb);letter-spacing:.28em;color:#d8cfb8;text-transform:uppercase;opacity:0;transition:opacity .5s;text-shadow:0 0 14px #000;z-index:3}
#introTxt.on{opacity:1}
#introSkip{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:14px;z-index:4}
#introTitle{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:5}
#introTitle.on{display:flex;animation:titslam .5s}
@keyframes titslam{0%{transform:scale(2.6);opacity:0;filter:blur(8px)}60%{transform:scale(.94);opacity:1;filter:blur(0)}100%{transform:scale(1)}}
#introTitle .glogo{font-size:clamp(48px,16vw,80px)}
#introSub{color:var(--dim);letter-spacing:.3em;font-size:10px;margin-top:14px;text-transform:uppercase}
.shock{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;border:2px solid var(--amber);opacity:.9;z-index:4;animation:shock .7s forwards}
@keyframes shock{to{width:130vmax;height:130vmax;margin:-65vmax;opacity:0;border-width:1px}}
.flashwhite{position:absolute;inset:0;background:#fff;opacity:0;z-index:6;pointer-events:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-swd" viewBox="0 0 24 24"><path d="M14.5 4.5l5 5L9 20l-4.5 1L5.5 16.5zM16.5 7.5l-3 3"/></symbol>
<symbol id="i-chip" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/></symbol>
<symbol id="i-skull" viewBox="0 0 24 24"><path d="M12 3a7 7 0 0 0-7 7c0 2.8 1.7 4.6 3 5.8V19h8v-3.2c1.3-1.2 3-3 3-5.8a7 7 0 0 0-7-7z"/><circle cx="9.3" cy="11" r="1.2" fill="currentColor"/><circle cx="14.7" cy="11" r="1.2" fill="currentColor"/></symbol>
<symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2L5 13.5h5L9 22l8-12.5h-5z"/></symbol>
<symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3c.8 4 5.5 5.5 5.5 10a5.5 5.5 0 0 1-11 0c0-3 2.2-4.4 2.2-7.2 1.2 1 2.6 1.6 3.3-2.8z"/></symbol>
<symbol id="i-snow" viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"/></symbol>
<symbol id="i-void" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M12 4a8 8 0 0 1 8 8M12 20a8 8 0 0 1-8-8M16.5 4.5A9 9 0 0 1 20 9M7.5 19.5A9 9 0 0 1 4 15"/></symbol>
<symbol id="i-box" viewBox="0 0 24 24"><path d="M4 8l8-4 8 4v9l-8 4-8-4zM4 8l8 4 8-4M12 12v9"/></symbol>
<symbol id="i-cart" viewBox="0 0 24 24"><path d="M4 6h2l2.2 10h9.3L20 8H7.5"/><circle cx="9.5" cy="20" r="1"/><circle cx="16.5" cy="20" r="1"/></symbol>
<symbol id="i-wrench" viewBox="0 0 24 24"><path d="M14.5 6.5a4.2 4.2 0 0 0-5.6 5.6L4 17l3 3 4.9-4.9a4.2 4.2 0 0 0 5.6-5.6L14.7 12l-2.7-2.7z"/></symbol>
<symbol id="i-quest" viewBox="0 0 24 24"><path d="M9.4 9a2.7 2.7 0 1 1 3.7 2.5c-1 .5-1.6 1.1-1.6 2.2M12 17.2h.01"/><circle cx="12" cy="12" r="9.2"/></symbol>
<symbol id="i-dice" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16"/><circle cx="9" cy="9" r="1" fill="currentColor"/><circle cx="15" cy="15" r="1" fill="currentColor"/><circle cx="15" cy="9" r="1" fill="currentColor"/><circle cx="9" cy="15" r="1" fill="currentColor"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.8-4.5 4.2 1.2 6L12 16.7l-5.4 2.9 1.2-6L3.3 9.4l6.1-.8z"/></symbol>
<symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12s3.8-6 9.5-6 9.5 6 9.5 6-3.8 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.6"/></symbol>
<symbol id="i-snd" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4zM16 9a4.5 4.5 0 0 1 0 6"/></symbol>
<symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4zM16.5 9.5l5 5M21.5 9.5l-5 5"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></symbol>
<symbol id="i-clk" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3.5 2"/></symbol>
</defs></svg>

<div id="app">
  <div class="screen" id="scrIntro">
    <canvas id="introCv"></canvas>
    <div id="introTxt"></div>
    <div class="shock" id="shock" style="display:none"></div>
    <div class="flashwhite" id="fwhite"></div>
    <div id="introTitle"><div class="glogo" data-t="DEADLINK">DEADLINK</div><div id="introSub">SIGNAL FROM THE BOTTOM OF THE STACK</div></div>
    <button class="iconbtn" id="introSkip">SKIP ▸▸</button>
  </div>

  <div class="screen on" id="scrBoot">
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px">
      <div class="glogo" data-t="DEADLINK">DEADLINK</div>
      <div class="subt">SIGNAL FROM THE BOTTOM OF THE STACK</div>
      <div style="width:min(300px,86%)">
        <button class="btn primary" id="bJack">JACK IN</button>
        <button class="btn" id="bResume" style="display:none">RESUME LINK</button>
        <button class="btn" id="bMeta">UPGRADE TERMINAL</button>
        <button class="btn" id="bCodex0">CODEX</button>
        <button class="btn" id="bIntro">REPLAY INTRO</button>
      </div>
      <div class="dimtx" id="bootstat" style="margin-top:18px;font-size:10px;letter-spacing:.1em"></div>
    </div>
    <button class="iconbtn" id="bMute" style="position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:12px"></button>
  </div>

  <div class="screen" id="scrClass">
    <div class="topbar"><span class="hd">SELECT RUNNER</span><span class="dimtx" id="clsShards"></span></div>
    <div class="clslist" id="clslist"></div>
  </div>

const NBASE={w:["MONO-KNIFE","PULSE SABER","DEBT SPIKE","RAIL NEEDLE","CHAIN GLAIVE","VIBRO SHIV","SLAGTHROWER","FLECHETTE PACK","BOLT CUTTER","KNUCKLE STACK","TERMINAL FANG","SEVERANCE BLADE"],

function genName(tier,slot){
 const B=()=>pick(NBASE[slot]);
 if(tier>=4&&Math.random()<.35)return pick(NUNIQ);
 if(tier===0)return Math.random()<.4?pick(NPRE)+" "+B():(Math.random()<.5?B()+" "+pick(NSUF):B());
 if(tier===1)return Math.random()<.5?pick(NPRE)+" "+B():pick(NADJ)+" "+B();
 if(tier===2)return Math.random()<.5?pick(NPRE)+" "+B()+" "+pick(NSUF):pick(NADJ)+" "+B()+" "+pick(NSUF);
 return pick(NPRE)+" "+pick(NADJ)+" "+B()+" "+pick(NSUF);
}
function rollTier(f,bias){let r=Math.random()*100-f*.55-(bias||0)*9;let t=r>52?0:r>22?1:r>-2?2:r>-20?3:4;if(t===3&&f<5)t=2;if(t===4&&f<12)t=3;return t}
function genItem(f,bias){
 const tier=rollTier(f,bias||0),slot=pick(["w","f","m"]);
 const affN=Math.min(4,1+tier+(Math.random()<.35?1:0));
 const pool=AFFS.slice();const affs=[];
 for(let i=0;i<affN;i++){const a=pool.splice(Math.floor(Math.random()*pool.length),1)[0];affs.push({id:a.id,t:Math.min(tier,RI(0,4))})}
 const base=slot==="w"?{atk:Math.round((4+f*1.15)*(1+.18*tier))}:slot==="f"?{def:Math.round((3+f*.9)*(1+.15*tier)),hp:Math.round((8+f*2.4)*(1+.15*tier))}:{hp:Math.round((5+f*1.6)*(1+.15*tier))};
 return {slot,tier,f,name:genName(tier,slot),base,affs,uid:Math.random().toString(36).slice(2)};
}
function affTxt(a){const def=AFFS.find(x=>x.id===a.id);const v=def.t[a.t];return (def.neg?"−":"+")+v+(def.pc?"%":"")+" "+def.n}
function itemValue(it){return Math.round((16+(it.f||1)*4)*(1+it.tier*1.15))}
function itemLines(it){const L=[];if(it.base.atk)L.push("+"+it.base.atk+" ATK");if(it.base.def)L.push("+"+it.base.def+" DEF");if(it.base.hp)L.push("+"+it.base.hp+" HP");it.affs.forEach(a=>L.push(affTxt(a)));return L}

let META={shards:0,unlocks:[],perks:{},codex:{},runs:0,best:0,kills:0,snd:1,introSeen:0};

let R=null,S=null;

function computeStats(){
 const c=CLASSES[R.cls],L=R.lvl-1,p=META.perks;
 let s={hp:c.base.hp+c.g.hp*L,sp:c.base.sp+c.g.sp*L,atk:c.base.atk+c.g.atk*L,def:c.base.def+c.g.def*L,
  mag:c.base.mag+c.g.mag*L,res:c.base.res+c.g.res*L,spd:c.base.spd+c.g.spd*L,
  crit:c.base.crit,luk:c.base.luk,spreg:5,leech:0,thorn:0,critd:0,ocost:0,maxsp:0,eldmg:{}};
 s.hp=(s.hp+R.bonus.hp)*(1+(p.vit||0)*.08);s.atk=(s.atk+R.bonus.atk)*(1+(p.off||0)*.06);
 s.mag*=(1+(p.off||0)*.06);s.def*=(1+(p.def||0)*.06);s.res*=(1+(p.def||0)*.06);s.spreg+=(p.port||0);
 ["w","f","m"].forEach(sl=>{const it=R.equip[sl];if(!it)return;
  if(it.base.atk)s.atk+=it.base.atk;if(it.base.def)s.def+=it.base.def;if(it.base.hp)s.hp+=it.base.hp;
  it.affs.forEach(a=>{const v=AFFS.find(x=>x.id===a.id).t[a.t];
   if(a.id==="atk")s.atk*=1+v/100;else if(a.id==="def")s.def*=1+v/100;else if(a.id==="mag")s.mag*=1+v/100;
   else if(a.id==="res")s.res*=1+v/100;else if(a.id==="hp")s.hp+=v;
   else if(a.id==="maxsp")s.maxsp+=v;else if(a.id==="ocost")s.ocost+=v;
   else if(a.id==="critd")s.critd+=v;else if(a.id==="crit")s.crit+=v;
   else s[a.id]=(s[a.id]||0)+v;});});
 Object.keys(s).forEach(k=>{if(k!=="eldmg")s[k]=Math.round(s[k]*10)/10});
 s.hp=Math.round(s.hp);s.spMax=Math.round(s.sp+s.maxsp);s.crit=Math.min(75,s.crit);
 S=s;
}
function xpNeed(l){return Math.round(30*Math.pow(l,1.18))}
function newRun(cls){
 R={cls,lvl:1,xp:0,chips:40+(META.perks.chips?60:0),floor:1,inv:[],equip:{w:null,f:null,m:null},
  skills:SKC[cls].slice(),loadout:SKC[cls].slice(),kills:0,bossKills:0,
  hp:0,sp:0,bonus:{hp:0,atk:0},flags:{},nodes:null,cleared:false,won:false,over:false};
 computeStats();R.hp=S.hp;R.sp=S.spMax;
 META.runs++;saveMeta();
}

 b.querySelectorAll(".mchoice").forEach(el=>el.addEventListener("click",()=>{SFX.tap();buzz(8);$("#modal").classList.remove("on");const i=+el.dataset.i;if(i>=0&&o.choices[i].f)o.choices[i].f();res(i>=0?o.choices[i]:null)}));

/* ================= sigil renderer ================= */
function drawSigil(cv,seed,elName,big){
 const ctx=cv.getContext("2d"),W=cv.width;ctx.clearRect(0,0,W,W);ctx.save();ctx.translate(W/2,W/2);
 const rng=mul32(seed),col=ELS[elName]?ELS[elName].c:"#e8a33d";
 const R1=W*.44,R2=W*.3;ctx.lineCap="square";
 const na=2+Math.floor(rng()*3);
 for(let i=0;i<na;i++){ctx.beginPath();const a0=rng()*Math.PI*2,ln=.4+rng()*1.6;ctx.strokeStyle=rng()<.5?col:"rgba(233,226,210,.5)";ctx.lineWidth=2+rng()*3;ctx.arc(0,0,R1*(0.82+rng()*.2),a0,a0+ln);ctx.stroke()}
 const ns=3+Math.floor(rng()*6);
 for(let i=0;i<ns;i++){const a=(i/ns)*Math.PI*2+rng()*.2;
  for(let j=0;j<2+Math.floor(rng()*3);j++){const r1=R2*rng()*.8,r2=r1+R2*(.2+rng()*.5);
   ctx.beginPath();ctx.strokeStyle=rng()<.7?col:"rgba(233,226,210,.35)";ctx.lineWidth=2+rng()*4;
   const a2=a+(rng()-.5)*.24;ctx.moveTo(Math.cos(a2)*r1,Math.sin(a2)*r1);ctx.lineTo(Math.cos(a2)*r2,Math.sin(a2)*r2);ctx.stroke();}}
 const k=3+Math.floor(rng()*5),rr=W*(.12+rng()*.09),rot=rng()*Math.PI;

 if(k==="atk"){let v=u.isP?S.atk:u.atk;if(u.sts.might)v*=1.3;return v}
 if(k==="mag"){let v=u.isP?S.mag:u.mag;if(u.sts.ward)v*=1.3;return v}

 if(k==="spd"){let v=u.isP?S.spd:u.spd;if(u.sts.haste)v*=1.4;if(u.sts.slow)v*=.6;return v}

function addSts(u,k,o){
 o=o||{};const s=u.sts;
 if(k==="corrupt"){s.corrupt=s.corrupt||{stacks:0,mag:0};s.corrupt.stacks=Math.min(12,s.corrupt.stacks+(o.stacks||1));if(o.mag)s.corrupt.mag=Math.max(s.corrupt.mag,o.mag)}
 else if(k==="dodge"){s.dodge=s.dodge||{n:0,t:99};s.dodge.n+=o.n||1}
 else if(k==="doom"){s.doom={t:o.t||3,val:Math.max(5,Math.round(o.val||0))}}
 else if(k==="edge"){s.edge=s.edge||{n:0,t:99};s.edge.n=Math.min(5,s.edge.n+(o.n||1))}
 else if(k==="thorns"){let v=o.val||0;if(o.atk)v=statOf(u,"atk")*o.val;if(o.deff)v=statOf(u,"def")*o.val;if(o.dmag)v=statOf(u,"mag")*o.val;s.thorns={t:o.t||3,val:Math.max(1,Math.round(v))}}
 else{s[k]=s[k]||{};s[k].t=Math.max(s[k].t||0,o.t||2);if(o.val!==undefined)s[k].val=o.val}

function applyDamage(u,amt){let rem=Math.round(amt);if(u.shield){const ab=Math.min(u.shield,rem);u.shield-=ab;rem-=ab}u.hp=Math.max(0,u.hp-rem);checkDeaths();return rem}
function hit(src,tgt,o){
 if(B.over)return 0;o=o||{};
 if(tgt.sts.dodge&&tgt.sts.dodge.n>0){tgt.sts.dodge.n--;if(tgt.sts.dodge.n<=0)delete tgt.sts.dodge;log(":: "+nameOf(tgt)+" phases out — <b>MISS</b>.","s");floatx(tgt,"MISS","miss");renderSts();return 0}
 if(src.sts.blind&&Math.random()<.35){log(":: "+nameOf(src)+" loses its lock — MISS.","s");floatx(tgt,"MISS","miss");return 0}
 const kind=o.k||"phys";
 const atk=kind==="phys"?statOf(src,"atk"):statOf(src,"mag");
 const def=kind==="phys"?statOf(tgt,"def"):statOf(tgt,"res");
 let d=(o.p||1)*atk*(100/(100+def*2.35));let note="";
 if(o.el&&tgt.weak===o.el){d*=1.45;note="WEAKPOINT "}
 else if(o.el&&tgt.res===o.el){d*=.55;note="RESIST "}
 if(o.el&&src.isP&&S.eldmg[o.el])d*=1+S.eldmg[o.el]/100;
 if(tgt.sts.frail)d*=1.35;if(src.sts.weak)d*=.65;if(tgt.sts.barrier)d*=.62;
 let crit=false;
 if(src.sts.surecrit||Math.random()*100<critOf(src)){d*=1.65+(src.isP?S.critd/100:0);crit=true}
 d*=.9+Math.random()*.2;d=Math.max(1,Math.round(d));
 const rem=applyDamage(tgt,d);
 if(src.isP)R.dmg=(R.dmg||0)+d;
 floatx(tgt,(crit?"CRIT ":"")+d,crit?"crit":"");
 flashx(tgt);
 if(crit||d>hpMax(tgt)*.16){shakex();SFX.crit();buzz([15,30,20])}else{SFX.hit();buzz(12)}
 log((src.isP?"> ":"! ")+nameOf(src)+" "+(o.vn||"hits")+" "+nameOf(tgt)+" for <b>"+d+"</b>"+(note?" <span class='ambtx'>"+note+"</span>":"")+(crit?" <span class='ambtx'>// CRITICAL</span>":""),src.isP?"p":"f");
 if(kind==="phys"&&tgt.sts.thorns){applyDamage(src,tgt.sts.thorns.val);floatx(src,tgt.sts.thorns.val);log("! "+nameOf(tgt)+"'s plating bites back.","f")}
 if(kind==="phys"&&tgt.isP&&R.cls==="bulwark"){const rv=Math.round(statOf(tgt,"def")*.18);applyDamage(src,rv);floatx(src,rv)}
 renderBars();renderSts();
 return rem;
}
function checkDeaths(){
 if(!B||B.over)return;
 if(E.hp<=0){B.over=true;B.win=true;return}
 if(P.hp<=0){
  if(P.sts.undying){P.sts.undying.t--;if(P.sts.undying.t<=0)delete P.sts.undying;P.hp=1;log(":: <span class='ambtx'>UNBREAKABLE</span> — the chassis refuses to fall. 1 HP.","s");renderSts();return}
  B.over=true;B.win=false;}
}
async function endTurn(u){
 if(B.over)return;
 const s=u.sts;
 if(s.bleed){applyDamage(u,s.bleed.val);log(":: "+nameOf(u)+" bleeds "+s.bleed.val+".","s");if(B.over)return}
 if(s.burn){applyDamage(u,s.burn.val);log(":: "+nameOf(u)+" burns "+s.burn.val+".","s");if(B.over)return}
 if(s.corrupt){const dm=Math.round(s.corrupt.stacks*(4+s.corrupt.mag*.1));applyDamage(u,dm);log(":: CORRUPT eats "+nameOf(u)+" for "+dm+".","s");if(B.over)return}
 if(s.regen)heal(u,hpMax(u)*s.regen.val,true);
 if(s.doom){s.doom.t--;if(s.doom.t<=0){log(":: <span class='redtx'>DOOM DETONATES</span> in "+nameOf(u)+".","s");applyDamage(u,s.doom.val);floatx(u,s.doom.val,"crit");delete s.doom;if(B.over)return}}
 ["bleed","burn","stun","silence","jam","blind","weak","frail","slow","haste","might","ward","guard","barrier","thorns","undying","surecrit","regen"].forEach(k=>{if(s[k]){s[k].t--;if(s[k].t<=0)delete s[k]}});

}
function castSkill(src,tgt,sk){
 if(sk.hpCost){const c=Math.round(hpMax(src)*sk.hpCost);src.hp=Math.max(1,src.hp-c);floatx(src,"−"+c);log(":: "+nameOf(src)+" pays "+c+" HP.","s")}
 let p=sk.p;
 if(sk.rand&&sk.pf)p=sk.pf();
 if(sk.edgeScale&&src.sts.edge){const e=src.sts.edge.n;p+=e*sk.edgeScale;log(":: "+e+" EDGE released.","s");delete src.sts.edge}
 if(sk.defScale&&src.isP)p+=S.def*sk.defScale;
 if(sk.exec&&tgt.hp/tgt.hpMax<sk.exec.h){p*=sk.exec.m;log(":: <span class='ambtx'>EXECUTE THRESHOLD</span>.","s")}
 let dealt=0;const hits=sk.hits||1;
 for(let i=0;i<hits;i++){if(B.over)break;dealt+=hit(src,tgt,{p,el:sk.el,k:sk.k})}
 const leech=(src.isP?S.leech:0)+(sk.drain||0);
 if(leech>0&&dealt>0)heal(src,dealt*leech,true);
 if(sk.healPct)heal(src,hpMax(src)*sk.healPct);
 if(sk.shSelf)gainShield(src,hpMax(src)*sk.shSelf);
 if(sk.shPct)gainShield(src,hpMax(src)*sk.shPct);
 if(sk.self)sk.self.forEach(x=>addSts(src,x[0],x[1]||{}));
 if(sk.inf)sk.inf.forEach(x=>{const o=Object.assign({},x[1]);let ch=o.c===undefined?1:o.c;delete o.c;
  if(src.isP&&R.cls==="glitcher")ch+=S.luk*.004;
  if(Math.random()<ch)addSts(tgt,x[0],o)});
 if(sk.corrupt)addSts(tgt,"corrupt",{stacks:sk.corrupt,mag:src.isP?statOf(src,"mag"):0});
 if(sk.doomT)addSts(tgt,"doom",{t:sk.doomT,val:statOf(src,"atk")*sk.doomValM});
 if(sk.edge)addSts(src,"edge",{n:sk.edge});
 if(sk.spg&&src.isP){P.sp=Math.min(S.spMax,P.sp+sk.spg)}
 if(sk.cleanse)cleanse(src);
 renderBars();renderSts();
 return dealt;
}

seven(s,t){let m=1;if(Math.random()<(7+S.luk*.5)/100){m=2.5;log(":: <span class='ambtx'>SEVENS! JACKPOT ROLL.</span>","s")}return hit(s,t,{p:1.5*m,el:"VOLTAIC"})},

 if(r<.6){log(":: <span class='grntx'>GRAND PRIZE — REPAIR.</span>","s");heal(s,hpMax(s)*.4);return 0}

function ocCost(cd){return Math.max(5,Math.ceil(S.hp*.05*cd*(1-Math.min(60,S.ocost)/100)))}
async function doPlayerAction(a){
 const c=CLASSES[R.cls];
 if(a.type==="focus"){
  const f=c.focus;SFX.use();log("> "+f.n,"p");
  if(f.fx)runFx(P,E,f);
  else if(f.p>0)castSkill(P,E,f);
  else{if(f.sh)gainShield(P,S.hp*f.sh);if(f.th)addSts(P,"thorns",{t:1,val:statOf(P,"def")*.8})}
  if(f.spg)P.sp=Math.min(S.spMax,P.sp+f.spg);
  if(f.edge)addSts(P,"edge",{n:f.edge});
  if(f.corrupt)addSts(E,"corrupt",{stacks:f.corrupt});
  if(f.drain>0){const d=hit(P,E,{p:f.p||0,el:f.el,k:"mag"});if(d>0)heal(P,d*f.drain,true)}
  renderAll();await wait(380);
 }else{

  if(a.oc){const cost=ocCost(P.cds[a.id]);P.hp=Math.max(1,P.hp-cost);floatx(P,"−"+cost+" OC");SFX.oc();buzz([10,30,10]);log(":: <span class='ambtx'>OVERCLOCK</span> — skill burns through cooldown. −"+cost+" HP.","s")}
  else{P.sp-=sk.sp;SFX.use()}
  P.cds[a.id]=sk.cd;log("> "+sk.n,"p");
  if(sk.fx)runFx(P,E,sk);else castSkill(P,E,sk);

 }

function aiPick(){
 const elig=E.moves.map(m=>m).filter(m=>(m._cd||0)<=0);
 if(!elig.length)return null;
 if(E.hp<E.hpMax*.55){const h=elig.find(m=>m.healPct);if(h&&Math.random()<.7)return h}
 const weighted=[];elig.forEach(m=>{let w=m.w||10;if(m.healPct)w=2;if(m.self)w=4;for(let i=0;i<w;i++)weighted.push(m)});
 return pick(weighted);
}

 if(R.flags.startBleed){addSts(P,"bleed",{t:2,val:Math.round(S.atk*.3)});log(":: Contagion blooms. You start BLEEDING.","s");delete R.flags.startBleed}

  B.round++;$("#btRound").textContent="ROUND "+String(B.round).padStart(2,"0");

  const order=ps+Math.random()*ps*.5>=es+Math.random()*es*.5?["P","E"]:["E","P"];
  for(const side of order){
   if(B.over)break;
   const u=side==="P"?P:E;
   if(u.sts.stun&&u.sts.stun.t>0){log(":: "+nameOf(u)+" is <span class='redtx'>STUNNED</span>.","s");floatx(u,"STUNNED","miss");u.sts.stun.t--;if(u.sts.stun.t<=0)delete u.sts.stun;renderSts();await wait(520);await endTurn(u);continue}

}

function mkEnemy(def,f,kind){

 const e={id:def.id,n:def.n,kind:kind||"n",flav:def.flav,weak:def.weak||null,res:def.res||null,boss:kind==="b",
  hp:Math.round((28+f*16.5)*def.hpM*(kind==="e"?1.55:1)*(f>30?1+(f-30)*.1:1)),
  atk:Math.round((6+f*1.15)*def.atkM*em*10)/10,def:(3+f*1.35)*(def.defM||1),mag:5+f*1.1,res:2+f*1.1,
  spd:def.spd,luk:5,moves:JSON.parse(JSON.stringify(def.moves)),sts:{},shield:0,noStun:def.noStun};
 e.moves.forEach(m=>m._cd=0);e.hpMax=e.hp;return e;

function genNodes(){
 const f=R.floor;
 if(f%5===0)return [{t:"boss"}];
 const avail=Object.keys(NODES).filter(k=>!NODES[k].min||f>=NODES[k].min);
 const out=[];const pool=avail.slice();
 while(out.length<3&&pool.length){
  let tot=pool.reduce((a,k)=>a+NODES[k].w,0),r=Math.random()*tot,sel=pool[0];
  for(const k of pool){r-=NODES[k].w;if(r<=0){sel=k;break}}
  pool.splice(pool.indexOf(sel),1);out.push({t:sel});
 }
 return out;
}

const INTRO=[
 {t:0,d:2.8,s:"THEY TELL IT DIFFERENT DOWN HERE.",sc:"rain"},

 {t:9.2,d:3.4,s:"THEY SAY A SIGNAL CLIMBS OUT OF THE ROOT SOME NIGHTS. IT SINGS IN A DEAD LANGUAGE.",sc:"sigil"},
 {t:12.6,d:1.4,s:"SOME HEARD IT AND WENT QUIET.",sc:"cuts"},

];
let introRun=false,introNodes=[];
function introScene(ctx,W,H,name,t){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle="#050506";ctx.fillRect(0,0,W,H);
 const c="#e8a33d",dim="rgba(233,226,210,.5)";
 if(name==="rain"){
  ctx.fillStyle=dim;ctx.font="10px monospace";
  for(let i=0;i<60;i++){const x=(hash("r"+i)%W),y=((t*90+hash("g"+i)%H*3)%H);ctx.globalAlpha=.1+((i*37)%10)/28;ctx.fillText("01<>/#%&"[i%9],x,y)}
  ctx.globalAlpha=1;
 }else if(name==="city"){
  ctx.fillStyle="#0d0d0f";ctx.fillRect(0,H*.3,W,H);
  for(let i=0;i<14;i++){const bw=W/14,bh=H*(.15+((i*53)%40)/100),x=i*bw;
   ctx.fillStyle="#101012";ctx.fillRect(x,H-bh,bw-4,bh);
   for(let j=0;j<8;j++){if((i*7+j*13)%5<2){ctx.fillStyle="rgba(255,77,61,.55)";ctx.fillRect(x+4+(j%2)*8,H-bh+8+j*14,3,3)}}}
  const g=ctx.createLinearGradient(0,H*.2,0,H);g.addColorStop(0,"rgba(232,163,61,.08)");g.addColorStop(1,"transparent");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 }else if(name==="shaft"){
  ctx.strokeStyle="rgba(232,163,61,.5)";
  for(let i=0;i<10;i++){const a=i/10*Math.PI*2+t;const r1=30+((t*400+i*77)%H),r2=r1+60;
   ctx.lineWidth=1+((i*31)%3);ctx.beginPath();ctx.moveTo(W/2+Math.cos(a)*r1*.6,H/2+Math.sin(a)*r1);ctx.lineTo(W/2+Math.cos(a)*r2*.9,H/2+Math.sin(a)*r2*1.4);ctx.stroke()}
  ctx.strokeStyle=c;ctx.lineWidth=2;ctx.strokeRect(W/2-20,H/2-20,40,40);
 }else if(name==="sigil"){
  const s=(t*20)%9999;
  ctx.strokeStyle=c;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(W/2,H/2,H*.28,0,Math.PI*2*t*.3%(Math.PI*2));ctx.stroke();
  ctx.save();ctx.translate(W/2,H/2);ctx.rotate(t*.5);
  for(let i=0;i<6;i++){ctx.rotate(Math.PI/3);ctx.beginPath();ctx.moveTo(0,H*.12);ctx.lineTo(H*.28,0);ctx.stroke()}
  ctx.restore();
  ctx.fillStyle=c;ctx.beginPath();ctx.arc(W/2,H/2,H*.05,0,Math.PI*2);ctx.fill();
 }else if(name==="cuts"){
  const k=Math.floor(t*6)%3;
  ctx.strokeStyle=k===0?c:k===1?"#ff4d3d":"#f4efe2";ctx.lineWidth=3;
  const cx=W/2,cy=H/2,r=H*.2;
  ctx.beginPath();for(let i=0;i<=3+k;i++){const a=i/(3+k)*Math.PI*2+t*3;const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.stroke();
  for(let i=0;i<8;i++){ctx.beginPath();ctx.moveTo(0,(hash("c"+i+Math.floor(t*6))%H));ctx.lineTo(W,(hash("d"+i+Math.floor(t*6))%H));ctx.lineWidth=1;ctx.globalAlpha=.2;ctx.stroke();ctx.globalAlpha=1}
 }
 ctx.fillStyle="rgba(232,163,61,.05)";
 for(let y=0;y<H;y+=3)ctx.fillRect(0,y,W,1);
}
function stopIntroAudio(){introNodes.forEach(n=>{try{n.stop?n.stop():0}catch(e){}});introNodes=[]}
async function playIntro(){
 if(introRun)return;introRun=true;
 droneStop();
 show("#scrIntro");
 const cv=$("#introCv"),ctx=cv.getContext("2d");
 const dpr=Math.min(2,window.devicePixelRatio||1);
 const W=cv.clientWidth*dpr,H=cv.clientHeight*dpr;cv.width=W;cv.height=H;
 $("#introTitle").classList.remove("on");$("#shock").style.display="none";
 const c=ac();
 const t0=c?c.currentTime+.1:0;
 /* --- score --- */
 if(c&&META.snd){
  const g=c.createGain();g.gain.value=1;g.connect(SND.master);
  const o1=c.createOscillator(),o2=c.createOscillator(),lp=c.createBiquadFilter(),dg=c.createGain();
  o1.type="sawtooth";o1.frequency.value=55;o2.type="sawtooth";o2.frequency.value=55.7;
  lp.type="lowpass";lp.frequency.setValueAtTime(120,t0);lp.frequency.exponentialRampToValueAtTime(900,t0+14);
  dg.gain.setValueAtTime(.001,t0);dg.gain.exponentialRampToValueAtTime(.06,t0+2);
  o1.connect(lp);o2.connect(lp);lp.connect(dg).connect(g);
  o1.start(t0);o2.start(t0);introNodes.push({stop(){try{o1.stop();o2.stop()}catch(e){}}});
  // heartbeat kicks, accelerating
  let bt=3.2;for(let i=0;i<22&&bt<15.2;i++){const tt=t0+bt;
   const o=c.createOscillator(),kg=c.createGain();o.type="sine";o.frequency.setValueAtTime(95,tt);o.frequency.exponentialRampToValueAtTime(38,tt+.16);
   kg.gain.setValueAtTime(.16,tt);kg.gain.exponentialRampToValueAtTime(.001,tt+.2);
   o.connect(kg).connect(g);o.start(tt);o.stop(tt+.25);introNodes.push({stop(){try{o.stop()}catch(e){}}});
   bt+=Math.max(.28,1.1-i*.04);}
  // riser
  const n=Math.floor(c.sampleRate*3.4),nb=c.createBuffer(1,n,c.sampleRate),nd=nb.getChannelData(0);
  for(let i=0;i<n;i++)nd[i]=(Math.random()*2-1);
  const ns=c.createBufferSource(),bp=c.createBiquadFilter(),ng=c.createGain();ns.buffer=nb;bp.type="bandpass";bp.Q.value=1.2;
  bp.frequency.setValueAtTime(200,t0+12.2);bp.frequency.exponentialRampToValueAtTime(6000,t0+15.4);
  ng.gain.setValueAtTime(.001,t0+12.2);ng.gain.exponentialRampToValueAtTime(.12,t0+15.3);ng.gain.exponentialRampToValueAtTime(.001,t0+15.9);
  ns.connect(bp).connect(ng).connect(g);ns.start(t0+12.2);introNodes.push({stop(){try{ns.stop()}catch(e){}}});
  // DROP
  const dt=t0+15.6;
  const sub=c.createOscillator(),sg=c.createGain();sub.type="sine";sub.frequency.setValueAtTime(170,dt);sub.frequency.exponentialRampToValueAtTime(28,dt+.9);
  sg.gain.setValueAtTime(.4,dt);sg.gain.exponentialRampToValueAtTime(.001,dt+1.6);
  sub.connect(sg).connect(g);sub.start(dt);sub.stop(dt+1.7);introNodes.push({stop(){try{sub.stop()}catch(e){}}});
  const cn=Math.floor(c.sampleRate*.7),cb=c.createBuffer(1,cn,c.sampleRate),cd2=cb.getChannelData(0);
  for(let i=0;i<cn;i++)cd2[i]=(Math.random()*2-1)*(1-i/cn);
  const cs=c.createBufferSource(),cg=c.createGain(),cf=c.createBiquadFilter();cs.buffer=cb;cf.type="lowpass";cf.frequency.value=150;cg.gain.value=.5;
  cs.connect(cf).connect(cg).connect(g);cs.start(dt);introNodes.push({stop(){try{cs.stop()}catch(e){}}});
  // post-drop pulse
  for(let i=0;i<8;i++){const tt=dt+.5+i*.55;
   const o=c.createOscillator(),kg=c.createGain();o.type="sine";o.frequency.setValueAtTime(80,tt);o.frequency.exponentialRampToValueAtTime(40,tt+.3);
   kg.gain.setValueAtTime(.22,tt);kg.gain.exponentialRampToValueAtTime(.001,tt+.35);
   o.connect(kg).connect(g);o.start(tt);o.stop(tt+.4);introNodes.push({stop(){try{o.stop()}catch(e){}}});
   if(i%2===0){const b2=c.createOscillator(),bg2=c.createGain();b2.type="sawtooth";b2.frequency.value=55;bg2.gain.setValueAtTime(.06,tt);bg2.gain.exponentialRampToValueAtTime(.001,tt+.4);b2.connect(bg2).connect(g);b2.start(tt);b2.stop(tt+.45);introNodes.push({stop(){try{b2.stop()}catch(e){}}})}}
 }
 /* --- visuals --- */
 let done=false;
 const finish=()=>{
  if(done)return;done=true;stopIntroAudio();introRun=false;
  META.introSeen=1;saveMeta();
  droneStart();
  showClassSelect();
 };
 const skip=$("#introSkip");const sh2=()=>{finish()};skip.addEventListener("click",sh2,{once:true});
 const start=performance.now();
 await new Promise(res=>{
  const loop=()=>{
   if(done){res();return}
   const t=(performance.now()-start)/1000;
   let sc="rain";
   for(const b of INTRO){if(t>=b.t)sc=b.sc}
   if(t<15.6){
    introScene(ctx,W,H,sc,t);
    const beat=INTRO.find(b=>t>=b.t&&t<b.t+b.d);
    const txt=$("#introTxt");
    if(beat){txt.textContent=beat.s;txt.classList.add("on")}else txt.classList.remove("on");
    requestAnimationFrame(loop);
   }else{
    if(!$("#introTitle").classList.contains("on")){
     $("#introTxt").classList.remove("on");
     ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
     $("#shock").style.display="block";
     const fw=$("#fwhite");fw.style.transition="none";fw.style.opacity=".8";requestAnimationFrame(()=>{fw.style.transition="opacity .5s";fw.style.opacity="0"});
     buzz([60,40,120]);
     $("#introTitle").classList.add("on");
     setTimeout(()=>{finish();res()},2400);
    }
   }
  };
  requestAnimationFrame(loop);
 });
}

   {t:"STAY"}]});
 });
 $("#bDescend").addEventListener("click",()=>{SFX.tap();buzz(8);R.floor++;R.cleared=false;R.nodes=null;saveRun();showNode()});
 /* battle input delegation */
 $("#skillgrid").addEventListener("click",e=>{
  const scan=e.target.closest("#scanBtn");if(scan){SFX.tap();showScan();return}
  if(!B||B.over||!_inp)return;
  const card=e.target.closest(".sk");if(!card)return;
  const id=Object.keys(cardEls).find(k=>cardEls[k]===card);if(!id)return;
  if(id==="FOCUS"){SFX.tap();submit({type:"focus"});return}
  const sk=SK[id];
  if(P.cds[id]>0){toast("ON COOLDOWN — OR OVERCLOCK IT");return}
  if(P.sp<sk.sp){toast("NOT ENOUGH SYNAPSE");return}
  SFX.tap();buzz(6);submit({type:"skill",id,oc:false});
 });
 $("#skillgrid").addEventListener("click",e=>{
  const oc=e.target.closest(".occhip");if(!oc||!B||B.over||!_inp)return;
  e.stopPropagation();
  const card=oc.closest(".sk");const id=Object.keys(cardEls).find(k=>cardEls[k]===card);
  if(!id||id==="FOCUS")return;
  if(P.cds[id]<=0)return;
  const cost=ocCost(P.cds[id]);
  if(cost>=P.hp){toast("NOT ENOUGH HP TO OVERCLOCK");return}
  if(oc.classList.contains("arm")){oc.classList.remove("arm");oc.textContent="OC −"+cost;submit({type:"skill",id,oc:true})}
  else{oc.classList.add("arm");oc.textContent="CONFIRM −"+cost+" HP";setTimeout(()=>{oc.classList.remove("arm");if(B)oc.textContent="OC −"+ocCost(P.cds[id])},1800)}
 });
 let lpT=null,lpFired=false;
 $("#skillgrid").addEventListener("pointerdown",e=>{
  const card=e.target.closest(".sk");if(!card)return;lpFired=false;
  lpT=setTimeout(()=>{lpFired=true;buzz(12);const id=Object.keys(cardEls).find(k=>cardEls[k]===card);
   showSkillInfo(id,id==="FOCUS"?CLASSES[R.cls].focus:SK[id])},430);
 });
 ["pointerup","pointerleave","pointercancel"].forEach(ev=>$("#skillgrid").addEventListener(ev,()=>clearTimeout(lpT)));
 $("#skillgrid").addEventListener("click",e=>{if(lpFired){e.stopPropagation();lpFired=false}},true);
 /* first-gesture audio unlock + menu drone */
 document.addEventListener("pointerdown",function once(){ac();if(META.snd&&!SND.drone&&!B)droneStart();document.removeEventListener("pointerdown",once)});
}
init();
</script>
